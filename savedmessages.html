<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Saved Messages</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --bg: #10131a;
    --bg-2: #171c26;
    --panel: #1b202b;
    --panel-border: #2a3140;
    --accent: #f2a65a;
    --accent-dim: #d88f45;
    --tag: #5b8def;
    --text: #f5f3ef;
    --text-muted: #868c98;
    --err: #e5665c;
    --bubble: #253049;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { font-family: 'Inter', sans-serif; color: var(--text); }

  .phone {
    max-width: 420px;
    height: 100vh;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(circle at 15% 5%, rgba(242,166,90,0.06), transparent 40%),
      var(--bg);
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-bottom: 1px solid var(--panel-border);
    flex-shrink: 0;
  }
  .header-icon {
    width: 38px; height: 38px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-dim));
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .header-title { font-family: 'Fraunces', serif; font-size: 17px; }
  .header-sub { font-size: 11.5px; color: var(--text-muted); }

  .messages {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
    -webkit-overflow-scrolling: touch;
  }
  .empty-hint {
    margin: auto; text-align: center; color: var(--text-muted); font-size: 13px; padding: 0 30px;
  }

  .bubble-row { display: flex; justify-content: flex-end; }
  .bubble {
    max-width: 76%;
    background: var(--bubble);
    border-radius: 16px 16px 4px 16px;
    padding: 9px 12px;
    font-size: 14px;
    line-height: 1.4;
  }
  .bubble .time {
    display: block; text-align: right; font-size: 10px; color: var(--text-muted);
    margin-top: 4px; font-family: 'JetBrains Mono', monospace;
  }
  .bubble img.msg-photo {
    width: 100%; max-width: 220px; border-radius: 12px; display: block; margin-bottom: 4px;
  }

  .voice-bubble { display: flex; align-items: center; gap: 10px; min-width: 190px; }
  .voice-play {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    background: var(--accent); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .voice-wave {
    flex: 1; height: 22px; display: flex; align-items: center; gap: 2px; overflow: hidden;
  }
  .voice-wave span {
    width: 3px; background: var(--text-muted); border-radius: 2px; flex-shrink: 0;
  }
  .voice-duration { font-size: 11px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; flex-shrink: 0; }

  .input-bar {
    flex-shrink: 0; padding: 10px 12px 14px;
    border-top: 1px solid var(--panel-border);
    background: var(--bg);
  }

  .row-normal { display: flex; align-items: flex-end; gap: 8px; }

  .icon-btn {
    width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
    background: var(--bg-2); border: 1px solid var(--panel-border);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn.send { background: var(--accent); border: none; }

  textarea#msgInput {
    flex: 1; resize: none; max-height: 100px; min-height: 40px;
    background: var(--bg-2); border: 1.5px solid var(--panel-border);
    border-radius: 20px; padding: 10px 16px; color: var(--text);
    font-family: 'Inter', sans-serif; font-size: 14px; outline: none;
    line-height: 1.35;
  }
  textarea#msgInput:focus { border-color: var(--accent); }

  .row-recording {
    display: none;
    align-items: center; gap: 12px;
    background: var(--bg-2); border: 1.5px solid var(--panel-border);
    border-radius: 20px; padding: 8px 14px;
  }
  .row-recording.show { display: flex; }
  .rec-dot {
    width: 10px; height: 10px; border-radius: 50%; background: var(--err);
    animation: pulse 1s infinite ease-in-out; flex-shrink: 0;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .rec-timer { font-family: 'JetBrains Mono', monospace; font-size: 13.5px; min-width: 70px; }
  .rec-limit { font-size: 11px; color: var(--text-muted); flex: 1; }
  .rec-btn {
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .rec-cancel { background: var(--bg); border: 1px solid var(--panel-border); }
  .rec-stop { background: var(--accent); }

  .mic-warning {
    display: none; font-size: 11.5px; color: var(--err); padding: 6px 4px 0; text-align: center;
  }
  .mic-warning.show { display: block; }
</style>
</head>
<body>

<div class="phone">

  <header>
    <div class="header-icon">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1a1200" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
    </div>
    <div>
      <div class="header-title" data-en="Saved Messages" data-ru="Избранное">Saved Messages</div>
      <div class="header-sub" data-en="Only visible to you" data-ru="Видно только вам">Only visible to you</div>
    </div>
  </header>

  <div class="messages" id="messages">
    <div class="empty-hint" id="emptyHint" data-en="Save text, photos, or voice notes here for yourself." data-ru="Сохраняйте здесь текст, фото или голосовые для себя.">
      Save text, photos, or voice notes here for yourself.
    </div>
  </div>

  <div class="input-bar">
    <div class="row-normal" id="rowNormal">
      <label class="icon-btn" for="photoInput" title="Photo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f2a65a" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      </label>
      <input type="file" id="photoInput" accept="image/*" style="display:none;">

      <textarea id="msgInput" rows="1" data-en-ph="Message" data-ru-ph="Сообщение" placeholder="Message"></textarea>

      <div class="icon-btn" id="micBtn" title="Voice message">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#f2a65a" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
      </div>
      <div class="icon-btn send" id="sendBtn" style="display:none;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a1200" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </div>
    </div>

    <div class="row-recording" id="rowRecording">
      <div class="rec-dot"></div>
      <div class="rec-timer" id="recTimer">0:00</div>
      <div class="rec-limit" data-en="max 4:00" data-ru="макс. 4:00">max 4:00</div>
      <button class="rec-btn rec-cancel" id="recCancel" title="Cancel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#868c98" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      </button>
      <button class="rec-btn rec-stop" id="recStop" title="Send">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#1a1200" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </div>

    <div class="mic-warning" id="micWarning" data-en="Microphone isn't available in this preview. Open the downloaded file in a regular browser tab to record voice messages." data-ru="Микрофон недоступен в этом предпросмотре. Откройте скачанный файл в обычной вкладке браузера, чтобы записывать голосовые.">
      Microphone isn't available in this preview. Open the downloaded file in a regular browser tab to record voice messages.
    </div>
  </div>
</div>

<script>
  let lang = 'en';
  const MAX_SECONDS = 240;

  const messagesEl = document.getElementById('messages');
  const emptyHint = document.getElementById('emptyHint');
  const msgInput = document.getElementById('msgInput');
  const sendBtn = document.getElementById('sendBtn');
  const micBtn = document.getElementById('micBtn');
  const rowNormal = document.getElementById('rowNormal');
  const rowRecording = document.getElementById('rowRecording');
  const recTimer = document.getElementById('recTimer');
  const micWarning = document.getElementById('micWarning');

  function fmtTime() {
    const d = new Date();
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }
  function fmtDuration(sec) {
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60);
    return m + ':' + s.toString().padStart(2,'0');
  }

  function hideEmptyHint() { emptyHint.style.display = 'none'; }
  function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

  msgInput.addEventListener('input', () => {
    sendBtn.style.display = msgInput.value.trim().length > 0 ? 'flex' : 'none';
    micBtn.style.display = msgInput.value.trim().length > 0 ? 'none' : 'flex';
    msgInput.style.height = 'auto';
    msgInput.style.height = Math.min(msgInput.scrollHeight, 100) + 'px';
  });
  msgInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendText();
    }
  });
  sendBtn.addEventListener('click', sendText);

  function sendText() {
    const text = msgInput.value.trim();
    if (!text) return;
    hideEmptyHint();
    const row = document.createElement('div');
    row.className = 'bubble-row';
    row.innerHTML = `<div class="bubble">${escapeHtml(text)}<span class="time">${fmtTime()}</span></div>`;
    messagesEl.appendChild(row);
    msgInput.value = '';
    msgInput.style.height = 'auto';
    sendBtn.style.display = 'none';
    micBtn.style.display = 'flex';
    scrollToBottom();
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('photoInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    hideEmptyHint();
    const reader = new FileReader();
    reader.onload = (ev) => {
      const row = document.createElement('div');
      row.className = 'bubble-row';
      row.innerHTML = `<div class="bubble"><img class="msg-photo" src="${ev.target.result}"><span class="time">${fmtTime()}</span></div>`;
      messagesEl.appendChild(row);
      scrollToBottom();
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });

  let mediaRecorder = null;
  let audioChunks = [];
  let recordSeconds = 0;
  let recordInterval = null;
  let recordStream = null;

  micBtn.addEventListener('click', startRecording);
  document.getElementById('recCancel').addEventListener('click', () => stopRecording(false));
  document.getElementById('recStop').addEventListener('click', () => stopRecording(true));

  async function startRecording() {
    micWarning.classList.remove('show');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      micWarning.classList.add('show');
      return;
    }
    try {
      recordStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (err) {
      micWarning.classList.add('show');
      return;
    }
    audioChunks = [];
    mediaRecorder = new MediaRecorder(recordStream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) audioChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      recordStream.getTracks().forEach(t => t.stop());
    };
    mediaRecorder.start();

    recordSeconds = 0;
    recTimer.textContent = fmtDuration(0);
    rowNormal.style.display = 'none';
    rowRecording.classList.add('show');

    recordInterval = setInterval(() => {
      recordSeconds++;
      recTimer.textContent = fmtDuration(recordSeconds);
      if (recordSeconds >= MAX_SECONDS) {
        stopRecording(true);
      }
    }, 1000);
  }

  function stopRecording(shouldSend) {
    if (recordInterval) { clearInterval(recordInterval); recordInterval = null; }
    rowRecording.classList.remove('show');
    rowNormal.style.display = 'flex';

    if (!mediaRecorder) return;
    const finalSeconds = recordSeconds;

    mediaRecorder.addEventListener('stop', function onStop() {
      mediaRecorder.removeEventListener('stop', onStop);
      if (shouldSend && audioChunks.length > 0 && finalSeconds > 0) {
        const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
        const url = URL.createObjectURL(blob);
        addVoiceBubble(url, finalSeconds);
      }
    });

    if (mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    mediaRecorder = null;
  }

  function addVoiceBubble(url, seconds) {
    hideEmptyHint();
    const bars = Array.from({length: 26}, () => 4 + Math.round(Math.random() * 14));
    const row = document.createElement('div');
    row.className = 'bubble-row';
    row.innerHTML = `
      <div class="bubble">
        <div class="voice-bubble">
          <button class="voice-play" data-playing="false"><svg class="play-icon" width="13" height="13" viewBox="0 0 24 24" fill="#1a1200"><polygon points="5 3 19 12 5 21 5 3"/></svg></button>
          <div class="voice-wave">${bars.map(h => `<span style="height:${h}px"></span>`).join('')}</div>
          <div class="voice-duration">${fmtDuration(seconds)}</div>
        </div>
        <audio class="voice-audio" src="${url}" style="display:none;"></audio>
        <span class="time">${fmtTime()}</span>
      </div>`;
    messagesEl.appendChild(row);
    scrollToBottom();

    const playBtn = row.querySelector('.voice-play');
    const audioEl = row.querySelector('.voice-audio');
    const durationEl = row.querySelector('.voice-duration');
    playBtn.addEventListener('click', () => {
      if (audioEl.paused) {
        audioEl.play();
        playBtn.querySelector('.play-icon').outerHTML = '<svg class="play-icon" width="13" height="13" viewBox="0 0 24 24" fill="#1a1200"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';
      } else {
        audioEl.pause();
      }
    });
    audioEl.addEventListener('timeupdate', () => {
      if (!audioEl.paused) durationEl.textContent = fmtDuration(audioEl.duration - audioEl.currentTime);
    });
    audioEl.addEventListener('ended', () => {
      durationEl.textContent = fmtDuration(seconds);
      playBtn.querySelector('.play-icon').outerHTML = '<svg class="play-icon" width="13" height="13" viewBox="0 0 24 24" fill="#1a1200"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
    });
  }
</script>

</body>
</html>
